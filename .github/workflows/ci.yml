name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # Use `npm install` (not strict `npm ci`) so CI reconciles the lockfile
        # when package.json has a dependency not yet recorded in package-lock.json
        # (e.g. pdfjs-dist). Runners have registry access, so this resolves cleanly.
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck
