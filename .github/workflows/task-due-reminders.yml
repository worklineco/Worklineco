name: TaskLine due reminders (09:00 IST)

on:
  schedule:
    - cron: "30 3 * * *" # 09:00 IST
  workflow_dispatch: {}

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Call WorkLine reminder endpoint
        run: |
          curl -fsS --max-time 290 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://www.worklineco.com/api/cron/task-due-reminders
