name: TaskLine due reminders (09:00 IST)

on:
  schedule:
    - cron: "30 3 * * *" # 09:00 IST
    # GitHub delivers scheduled events hours late, so retry through the day;
    # the endpoint holds mails until 09:00 IST and dedupes repeat sends.
    - cron: "*/20 3-12 * * *"
  workflow_dispatch: {}

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Call WorkLine reminder endpoint
        run: |
          curl -fsS --max-time 290 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://www.worklineco.com/api/cron/task-due-reminders
