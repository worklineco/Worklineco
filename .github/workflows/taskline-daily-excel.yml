name: TaskLine daily Excel (10:00 IST)

on:
  schedule:
    - cron: "30 4 * * *" # 10:00 IST
  workflow_dispatch: {}

jobs:
  send-daily-excel:
    runs-on: ubuntu-latest
    steps:
      - name: Call WorkLine TaskLine daily Excel endpoint
        run: |
          curl -fsS --max-time 290 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://www.worklineco.com/api/cron/taskline-daily-excel
