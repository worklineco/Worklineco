name: Nightly Google Drive backup (00:00 IST)

on:
  schedule:
    - cron: "40 18 * * *" # 00:10 IST, after the reminder job
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Call WorkLine Drive backup endpoint
        run: |
          curl -fsS --max-time 290 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://www.worklineco.com/api/cron/drive-backup

